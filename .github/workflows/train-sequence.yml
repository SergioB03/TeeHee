name: Train sequence model

# Trains the GRU threat model with PyTorch and commits the generated weights
# and refreshed results back to the branch. Runs on demand, or when the
# training code changes on the sequence-model branch.
on:
  workflow_dispatch:
  push:
    branches: [claude/sequence-model]
    paths:
      - edge-sentry/ml/train_seq.py
      - edge-sentry/ml/seqlab.py
      - edge-sentry/ml/evaluate.py
      - .github/workflows/train-sequence.yml

permissions:
  contents: write

defaults:
  run:
    working-directory: edge-sentry

jobs:
  train:
    name: Train, evaluate and commit weights
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyTorch (CPU build)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build edge-sim
        run: npm run build:native
      - name: Train the sequence model
        run: python3 ml/train_seq.py
      - name: Rebuild edge-sim with the new weights
        run: npm run build:native
      - name: CLI regression tests
        run: npm test
      - name: Evaluate against the default model (held-out rollouts, scenarios, parity)
        run: python3 ml/evaluate.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: sequence-model
          path: |
            edge-sentry/ml/sequence.json
            edge-sentry/ml/RESULTS.md
            edge-sentry/native/src/sequence_weights.hpp
      - name: Commit weights and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/sequence.json ml/RESULTS.md native/src/sequence_weights.hpp
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Train sequence model: generated weights and results"
          git push
