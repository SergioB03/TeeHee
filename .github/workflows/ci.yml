name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: edge-sentry

jobs:
  simulator:
    name: Simulator, model and web console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build edge-sim
        run: npm run build:native
      - name: CLI regression tests
        run: npm test
      - name: Requirements trace (every requirement names a check that still exists)
        run: npm run trace
      - name: READMEs agree with the generated reports, and their links resolve
        run: npm run docs:check
      - name: Model evaluation (held-out metrics, scenarios, C++/Python parity)
        run: npm run eval:model
      - name: Results file is up to date
        run: git diff --exit-code -- ml/RESULTS.md
      - name: Outcome evaluation (triage policies, quick version)
        run: npm run eval:outcome
      - name: Autonomy planner evaluation (quick version)
        run: npm run eval:autonomy
      - name: Red opponent evaluation (quick version)
        run: npm run eval:opponent
      - name: Sensing and tracker evaluation (quick version)
        run: npm run eval:tracking
      - name: Training environment and hold-fire mask
        run: npm run test:rl
      - name: Learned policy against the planner (quick version; plain Python, no PyTorch)
        run: npm run eval:rl
      - name: Software-in-the-loop (simulator plus a separate edge-node over TCP)
        run: npm run sil
      - name: Web console with twelve visitors at once (both sides, autopilot on and off, sandbox)
        run: npm run test:web
      - name: Web console smoke test
        run: |
          PORT=3100 node web/server.mjs &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:3100/api/state >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:3100/ | grep -q "edge-sentry console"
          curl -sf -X POST -H 'content-type: application/json' -d '{"n":3}' http://127.0.0.1:3100/api/tick | grep -q '"ok":true'
          curl -sf -X POST -H 'content-type: application/json' -d '{"id":"B-HQ","action":"defend","target":"R-JET1","reason":"ci smoke"}' http://127.0.0.1:3100/api/order | grep -q '"ok":true'
          curl -sf http://127.0.0.1:3100/api/decisions | grep -q '"reason":"ci smoke"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"n":999}' http://127.0.0.1:3100/api/tick)" = 400
          curl -sf -X POST -H 'content-type: application/json' -d '{"noise":0.7}' http://127.0.0.1:3100/api/sensing | grep -q '"noise":0.7'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"noise":7}' http://127.0.0.1:3100/api/sensing)" = 400
          curl -sf -X POST -H 'content-type: application/json' -d '{"noise":0}' http://127.0.0.1:3100/api/sensing | grep -q '"noise":0,'
      - name: Play mode smoke test (choose a side, play the computer)
        run: |
          J='content-type: application/json'; S='x-session: cismoke000001'; B=http://127.0.0.1:3100
          curl -sf -X POST -H "$J" -H "$S" -d '{"side":"red"}' $B/api/game/start | grep -q '"side":"red"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$J" -H "$S" -d '{"id":"B-HQ","action":"cease"}' $B/api/order)" = 400
          curl -sf -X POST -H "$J" -H "$S" -d '{"id":"R-MSL1","action":"launch","target":"B-HQ"}' $B/api/order | grep -q '"ok":true'
          curl -sf -X POST -H "$J" -H "$S" -d '{"n":20}' $B/api/tick | grep -q '"over":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$J" -H "$S" -d '{"n":1}' $B/api/tick)" = 400
          curl -sf $B/api/state | grep -q '"game":null'
          curl -sf -H 'x-session: cismoke000002' $B/api/state | grep -q '"auto":{"red":true,"blue":false}'
          curl -sf -X POST -H "$J" -H 'x-session: cismoke000002' -d '{"n":2}' $B/api/tick | grep -q '"opponentOrders":\[{'
          curl -sf -X POST -H "$J" -H 'x-session: cismoke000002' -d '{"red":false,"blue":true}' $B/api/auto | grep -q '"auto":{"red":false,"blue":true}'
          curl -sf -X POST -H "$J" -H "$S" -d '{"side":"blue"}' $B/api/game/start | grep -q '"autopilot":false'
          curl -sf -X POST -H "$J" -H "$S" -d '{"on":true}' $B/api/game/autopilot | grep -q '"autopilot":true'
          curl -sf -X POST -H "$J" -H "$S" -d '{"n":5}' $B/api/tick | grep -q '"autopilotOrders":\[{'
          curl -sf -X POST -H "$J" -H "$S" -d '{"side":"red"}' $B/api/game/start | grep -q '"autopilot":false'
          curl -sf -X POST -H "$J" -H "$S" -d '{"on":true}' $B/api/game/autopilot | grep -q '"autopilot":true'
          curl -sf -X POST -H "$J" -H "$S" -d '{"n":5}' $B/api/tick | grep -q '"autopilotOrders":\[{"id":"R-'

  arm64:
    name: Edge node on arm64 (emulated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the arm64 cross compiler and emulator
        run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu qemu-user-static
      - name: Build edge-sim for this machine
        run: npm run build:native
      - name: Cross-compile edge-node for arm64 (the Raspberry Pi and Jetson architecture)
        run: |
          aarch64-linux-gnu-g++ -std=c++17 -O2 -static -Inative/src native/node/edge_node.cpp native/src/autonomy.cpp -o /tmp/edge-node-arm64
          file /tmp/edge-node-arm64 | grep -q "ARM aarch64"
          printf '#!/bin/sh\nexec qemu-aarch64-static /tmp/edge-node-arm64 "$@"\n' > /tmp/edge-node-arm64.sh
          chmod +x /tmp/edge-node-arm64.sh
      - name: Planner tests against the arm64 build
        run: python3 native/tests/test_planner.py /tmp/edge-node-arm64.sh
      - name: Software-in-the-loop with the arm64 node
        run: python3 sil/run_sil.py --rollouts 8 --budget-ms 250 --node-bin /tmp/edge-node-arm64.sh --label "an arm64 build under QEMU emulation" --check --no-write
      - name: The planner's Docker image for arm64 (cross-compiled inside the image build)
        run: |
          docker build --platform linux/arm64 --target edge-node -t edge-sentry-node:arm64 .
          test "$(docker image inspect edge-sentry-node:arm64 --format '{{.Architecture}}')" = arm64
          id=$(docker create --platform linux/arm64 edge-sentry-node:arm64)
          docker cp "$id":/edge-node /tmp/edge-node-image-arm64
          docker rm "$id" > /dev/null
          file /tmp/edge-node-image-arm64 | grep -q "ARM aarch64"
          printf '#!/bin/sh\nexec qemu-aarch64-static /tmp/edge-node-image-arm64 "$@"\n' > /tmp/edge-node-image-arm64.sh
          chmod +x /tmp/edge-node-image-arm64.sh
      - name: Planner tests against the binary taken out of the arm64 image
        run: python3 native/tests/test_planner.py /tmp/edge-node-image-arm64.sh

  docker:
    name: Docker images and compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the console, planner and tools images, then run them (non-root, read-only, SIL across two containers)
        run: python3 docker/check.py

  training:
    name: Training image and a smoke run (CPU build of PyTorch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the training image with the CPU-only PyTorch
        run: docker compose build --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cpu train-cpu
      - name: Train for a minute, test on held-out games, export, and check the export against PyTorch
        run: docker compose run --rm train-cpu python3 ml/rl_train.py --smoke
      - name: The shipped policy runs in the image without touching the checkout
        run: docker compose run --rm train-cpu python3 ml/test_rl.py

  ros2:
    name: ROS 2 bridge (Jazzy, in its Docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the ROS 2 image, run the demo, and check the topics between the two nodes
        run: python3 docker/check.py --ros2

  typecheck:
    name: TypeScript and agent project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge-sentry/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: No known vulnerabilities in dependencies
        run: npm audit --audit-level=moderate
      - name: Agent project loads (no model login needed)
        run: |
          npm run build:native
          npx agent-sdk validate --dir .
          npx agent-sdk eval --dir . --list
      - name: Agent tools run against the simulator (no model login needed)
        run: |
          npx agent-sdk tool call map_status --dir . --input '{"reset":true}'
          npx agent-sdk tool call issue_order --dir . --input '{"id":"B-HQ","action":"defend","target":"R-MSL1","reason":"ci smoke"}'
          npx agent-sdk tool call run_tick --dir . --input '{"n":2}'
          npx agent-sdk tool call decision_log --dir . --input '{"n":5}'
